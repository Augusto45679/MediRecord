services:
  - type: web
    name: medirecord-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: uv run --no-dev uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: DATABASE_URL
        sync: false # pegar la connection string de Neon
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false # URL de Vercel, sin "/" final
